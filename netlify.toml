# Netlify builds the site directly from this monorepo. The corpus lives at the
# repo root and the site is a bun workspace under apps/site, so the build runs
# bun at the root (for the workspace install) and then builds the site, whose
# prebuild reads the corpus from ../../corpus. The Astro build's heap ceiling
# is raised in apps/site/package.json for the ~28k-page scale.
[build]
  command = "bun install && cd apps/site && bun run build"
  publish = "apps/site/dist"

[build.environment]
  BUN_VERSION = "1.2.18"
  NODE_VERSION = "20"

[[headers]]
  for = "/pagefind/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=86400"
