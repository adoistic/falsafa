name: Deploy site to Netlify

# Builds the full static site in a GitHub-hosted runner (16 GB RAM, 14 GB
# disk — far more than a hobby PaaS builder) and deploys the prebuilt dist to
# Netlify, whose free tier has no hard file-count or size cap. This is how the
# ~28k-page / ~945k-paragraph library ships for free at scale: the heavy
# astro + pagefind build runs here, Netlify only serves the output.
#
# Requires two repository secrets:
#   NETLIFY_AUTH_TOKEN  — a Netlify personal access token
#   NETLIFY_SITE_ID     — the API ID of the Netlify site to deploy to

# Netlify now builds + deploys natively from the GitHub integration (see
# netlify.toml). This workflow is the FALLBACK: if Netlify's own builder
# cannot handle the build at scale, run this manually (it builds in a
# 16 GB runner and deploys the prebuilt dist via the Netlify CLI). Needs
# NETLIFY_AUTH_TOKEN + NETLIFY_SITE_ID secrets.
on:
  workflow_dispatch: {}

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build the site (astro + pagefind)
        working-directory: apps/site
        run: bun run build

      - name: Report build size
        working-directory: apps/site
        run: |
          echo "dist size: $(du -sh dist | cut -f1)"
          echo "file count: $(find dist -type f | wc -l)"

      - name: Deploy prebuilt dist to Netlify
        working-directory: apps/site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx -y netlify-cli@17 deploy \
            --dir=dist \
            --prod \
            --no-build \
            --message "GHA build ${GITHUB_SHA::7}" \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN"
