name = "falsafaai"
main = "src/index.js"
compatibility_date = "2026-06-25"
workers_dev = true

# Cloudflare Worker routes are attached through the zone API:
#   falsafa.ai/* and www.falsafa.ai/* -> falsafaai

# Serve the static build from R2. The first upload is done out-of-band via the
# bearer REST endpoint (t2work/r2-upload.sh); this binding gives the Worker read access.
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "falsafaai"

# Audio corpus (HLS streams + alignment sidecars), generated by the
# falsafa-audio pipeline. Separate bucket from the site build on purpose:
# the site deploy rclone-syncs the falsafaai bucket with no excludes.
[[r2_buckets]]
binding = "AUDIO"
bucket_name = "falsafa-audio"
